# 港股 ETF 量化研究工作流 — 全局配置
# 所有可调参数在此文件管理，代码层无硬编码

# ──────────────────────────────────────────
# 标的池
# ──────────────────────────────────────────
universe:
  tickers:
    - "02800.HK"    # 恒生指数 ETF
    - "03033.HK"    # 恒生科技 ETF
    - "02828.HK"    # 国企 ETF
    - "02840.HK"    # SPDR 金 ETF (黄金防守)
  defensive_tickers:
    - "CASH"        # 现金占位
    - "02840.HK"    # 黄金 ETF 也视为防守资产

# ──────────────────────────────────────────
# 动量参数
# ──────────────────────────────────────────
momentum:
  periods: [20, 60]          # 收益率计算周期 (交易日)
  weights: [0.4, 0.6]        # 动量权重 (顺序对应 periods)

# ──────────────────────────────────────────
# 波动率参数
# ──────────────────────────────────────────
volatility:
  window: 20                 # 滚动波动率窗口 (交易日)
  penalty: 0.2               # 波动率惩罚系数
  annualization_factor: 252  # 年化交易日数

# ──────────────────────────────────────────
# 趋势参数
# ──────────────────────────────────────────
trend:
  ma_periods: [20, 60]       # 均线周期

# ──────────────────────────────────────────
# 仓位参数
# ──────────────────────────────────────────
position:
  max_single: 0.5            # 单标的仓位上限
  cash_default: 0.5          # 默认现金比例
  defensive_on_break_ma: 60  # 跌破该 MA 则触发防守
  top_n: 1                   # 持仓 ETF 数量

# ──────────────────────────────────────────
# 回测参数 (Phase 1 极简回测)
# ──────────────────────────────────────────
backtest:
  years: 1                   # 回测年数
  rebalance_freq: "W"        # 调仓频率 (W=周, D=日, 2W=双周)
  initial_capital: 1_000_000 # 初始资金

# ──────────────────────────────────────────
# 数据源参数
# ──────────────────────────────────────────
data:
  primary_source: "yahoo"    # 当前主数据源
  cache_dir: "data_cache/hist"
  max_retries: 3
  retry_delay_sec: 2

# ──────────────────────────────────────────
# 日志参数
# ──────────────────────────────────────────
logging:
  level: "INFO"
  file: "logs/etf-quant.log"

# ──────────────────────────────────────────
# 日报参数
# ──────────────────────────────────────────
report:
  output_dir: "reports/output"
  date_format: "%Y-%m-%d"

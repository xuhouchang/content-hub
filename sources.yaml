# ── Consulting Reports ──
# 每天采集（原先仅有周一，改为每天后可以提高企业端内容供给）
# 搜索查询通过 Serper API 执行
consulting:
  enabled: true
  run_daily: true
  firms:
    - "McKinsey"
    - "BCG"
    - "Deloitte"
    - "PwC"
    - "Accenture"
    - "Bain"
    - "KPMG"
    - "IBM IBV"
    - "Capgemini"
    - "Stanford HAI"
    - "CB Insights"

  search_queries:
    - '"{firm}" "enterprise AI" implementation case study deployment'
    - '"{firm}" enterprise AI ROI OR cost savings OR automation results'
    - '"{firm}" AI workflow OR process redesign business results'
    - '"{firm}" AI workforce OR reskilling organizational landing report'
    - '"enterprise AI" "case study" deployment metrics'
    - '"AI agent" production enterprise rollout results'
    - '"generative AI" enterprise measurable outcome case'
    - '"AI implementation" lessons learned enterprise real world'


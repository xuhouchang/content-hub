# ── Filtering Rules ──
# 定义内容相关度过滤的各个分类。每个分类指定关键词和权重。
# 此配置会合并到 filter_items.py 的系统 prompt 中（通过模板变量注入）。
filtering:
  rules:
    - id: "enterprise-ai-adoption"
      label: "AI在企业中的实际落地（主轴）"
      weight: 90
      keywords: ["deployment", "adoption", "implementation", "ROI", "workflow", "automation rate", "cost savings", "measured", "metrics"]

    - id: "case-study"
      label: "企业AI落地案例"
      weight: 95
      keywords: ["case study", "real-world", "production", "deployment", "lessons learned", "go live", "piloted"]

    - id: "ai-engineering-product"
      label: "AI工程/产品与真实应用"
      weight: 85
      keywords: ["AI engineering", "LLM app", "agent", "product", "prompt engineering", "system prompt", "retrieval", "production"]

    - id: "org-talent"
      label: "组织/人才/绩效（落地辅助）"
      weight: 80
      keywords: ["workforce", "reskilling", "organization", "culture", "leadership", "role change"]

    - id: "technical-architecture"
      label: "AI系统建设/架构"
      weight: 60
      keywords: ["infrastructure", "architecture", "LLM", "training", "deployment"]

    - id: "ai-governance"
      label: "AI治理与风险合规（仅作落地辅助，不作主轴高分）"
      weight: 40
      keywords: ["risk", "compliance", "safety", "regulation", "governance"]

    - id: "surprising-research"
      label: "反常识AI研究"
      weight: 40
      keywords: ["unexpected", "surprising", "counterintuitive", "discovery"]